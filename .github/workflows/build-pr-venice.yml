name: Build Firmware (PR) on Venice

permissions:
  contents: read

on:
  pull_request:
    paths:
    - 'boards/venice/**'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/imx/**'
    - 'feeds.conf.default'
    - 'patches/venice/**'
    - 'scripts/openmanet_setup.sh'
    - 'scripts/check-board-patches.sh'
    - 'scripts/board-patch-digest.sh'
    - 'scripts/patch-witness.sh'
    - 'scripts/stamp-batman-build.sh'

jobs:
  build-venice:
    name: Build Venice
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: venice
      target: imx
      subtarget: cortexa53
      description: "Gateworks Venice"
