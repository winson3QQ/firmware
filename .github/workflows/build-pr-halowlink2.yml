name: Build Firmware (PR) on halowlink2

permissions:
  contents: read

on:
  pull_request:
    paths:
    - 'boards/halowlink2/**'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/ramips/**'
    - 'feeds.conf.default'
    - 'patches/halowlink2/**'
    - 'scripts/openmanet_setup.sh'
    - 'scripts/check-board-patches.sh'
    - 'scripts/board-patch-digest.sh'
    - 'scripts/patch-witness.sh'
    - 'scripts/stamp-batman-build.sh'

jobs:
  build-halowlink2:
    name: Build HalowLink2
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: halowlink2
      target: ramips
      subtarget: mt7621
      description: "HalowLink 2 (MT7621)"
