name: Build Firmware

on:
  workflow_call:
    inputs:
      board:
        description: 'Board name (e.g., ekh-bcm2711)'
        required: true
        type: string
      target:
        description: 'OpenWrt target platform (e.g., bcm27xx)'
        required: true
        type: string
      subtarget:
        description: 'OpenWrt subtarget (e.g., bcm2711)'
        required: true
        type: string
      description:
        description: 'Human-readable description of supported hardware'
        required: true
        type: string
      releasepackages:
        description: 'Upload built packages as artifacts for release publishing'
        required: false
        type: boolean
        default: false
      cpu_arch:
        description: 'CPU architecture directory name under bin/packages/ (e.g., aarch64_cortex-a72). Leave empty to skip arch package upload.'
        required: false
        type: string
        default: ''
    secrets:
      USIGN_PRIVATE_KEY:
        description: 'usign private key used to sign package indexes. Optional; an ephemeral key is generated when absent.'
        required: false
      USIGN_PUBLIC_KEY:
        description: 'usign public key matching USIGN_PRIVATE_KEY, installed into images as the trusted opkg key.'
        required: false

jobs:
  build:
    name: Build ${{ inputs.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib g++-multilib git gettext \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip golang-go zlib1g-dev swig file wget libnl-3-dev \
            libnl-genl-3-dev libgps-dev libcap-dev pkg-config libopus-dev \
            libopusfile-dev portaudio19-dev net-tools libpcre3-dev libpcre3 upx-ucl

      - name: Setup cache
        uses: actions/cache@v5
        with:
          path: |
            dl
          key: ${{ inputs.board }}-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}

      - name: Use HTTPS for GitHub clones in CI
        run: |
          # Both rewrites target the same config key, so the second must use
          # --add; a plain `git config` would replace the first value and leave
          # scp-style git@github.com: URLs (used by openmanetd submodules)
          # untouched.
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"
          git config --global --get-all url."https://github.com/".insteadOf
          # Fail fast if the rewrite is broken: these are the exact URL forms
          # the openmanetd submodules use, and the runner has no SSH keys, so
          # without a working rewrite these die here in seconds instead of
          # hours into the build.
          GIT_TERMINAL_PROMPT=0 git ls-remote git@github.com:OpenMANET/go-alfred.git HEAD
          GIT_TERMINAL_PROMPT=0 git ls-remote ssh://git@github.com/OpenMANET/protobufs.git HEAD

      - name: Configure build for ${{ inputs.board }}
        run: |
          ./scripts/openmanet_setup.sh -i -b ${{ inputs.board }}

      - name: Install package signing key
        if: inputs.releasepackages
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
          USIGN_PUBLIC_KEY: ${{ secrets.USIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$USIGN_PRIVATE_KEY" ] || [ -z "$USIGN_PUBLIC_KEY" ]; then
            echo "Signing key secrets unavailable; build will generate an ephemeral key."
            exit 0
          fi
          # usign requires the two-line signify format; restore the comment
          # line if the secret holds only the base64 key material.
          write_key() {
            dest="$1"; content="$2"; comment="$3"
            case "$content" in
              "untrusted comment:"*) printf '%s\n' "$content" > "$dest" ;;
              *)
                printf 'untrusted comment: %s\n' "$comment" > "$dest"
                printf '%s\n' "$content" >> "$dest"
                ;;
            esac
          }
          write_key key-build "$USIGN_PRIVATE_KEY" "OpenMANET packages private key"
          write_key key-build.pub "$USIGN_PUBLIC_KEY" "OpenMANET packages public key"
          chmod 600 key-build
          echo "Installed persistent package signing key."

      - name: Download dependencies
        run: |
          make download -j$(nproc)

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "Build completed for ${{ inputs.board }}"

      - name: Check build output
        run: |
          ls -lah bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/
          echo "=== Images created ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.img.gz" -o -name "*.bin"
          echo "=== Build info files ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.buildinfo"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ inputs.board }}
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*.img.gz artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*sysupgrade.bin artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/sha256sums artifacts/${{ inputs.board }}/ 2>/dev/null || true
          echo "Board: ${{ inputs.board }}" > artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Description: ${{ inputs.description }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Target: ${{ inputs.target }}/${{ inputs.subtarget }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt

      # #89 A/B OTA: repackage the standard image's rootfs+boot into the batman A/B sysupgrade tar
      # (root.squashfs + boot/ + metadata) that our /lib/upgrade/platform.sh consumes on the GPT A/B
      # card. Best-effort (continue-on-error): a failure here must never fail the firmware build; the
      # standard image is still uploaded. Only the A/B card board (ekh-bcm2711) has A/B slots today.
      - name: Build A/B OTA payload (#89)
        if: inputs.board == 'ekh-bcm2711'
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          D="bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}"
          ls -lah "$D" || true
          # 1) bin/targets ships ONLY whole-disk sysupgrade images (no standalone rootfs.squashfs —
          #    #89 bench confirmed), so carve the rootfs out of the mm6108-spi image (manet01's variant).
          IMGGZ=$(ls "$D"/*mm6108-spi*sysupgrade.img.gz 2>/dev/null | head -1)
          [ -n "$IMGGZ" ] || { echo "no mm6108-spi sysupgrade image in $D — dir listing:"; find "$D" -maxdepth 1 -type f | sort; exit 1; }
          gunzip -kf "$IMGGZ"; IMG="${IMGGZ%.gz}"
          # MBR partition 2 = rootfs squashfs. start LBA at byte 470 (part-entry-2 +8), LE u32; squashfs
          # bytes_used at p2off+40, LE u64. Carve exactly bytes_used (a standalone squashfs == its size).
          P2OFF=$(( $(dd if="$IMG" bs=1 skip=470 count=4 2>/dev/null | od -An -tu4 | tr -d ' ') * 512 ))
          [ "$(dd if="$IMG" bs=1 skip="$P2OFF" count=4 2>/dev/null)" = hsqs ] || { echo "p2@$P2OFF not squashfs"; exit 1; }
          SQBYTES=$(dd if="$IMG" bs=1 skip=$((P2OFF+40)) count=8 2>/dev/null | od -An -tu8 | tr -d ' ')
          dd if="$IMG" of=root.squashfs bs=1M iflag=skip_bytes,count_bytes skip="$P2OFF" count="$SQBYTES" 2>/dev/null
          echo "carved root.squashfs: $(wc -c < root.squashfs) bytes (expected $SQBYTES)"
          # 2) bootdir = the boot FAT (p1) of the same image (ro loop-mount; vfat lookups are
          #    case-insensitive, so build-ab-payload.sh finds KERNEL8.IMG etc via its lowercase names).
          LOOP=$(sudo losetup -Pf --show "$IMG")
          sudo mkdir -p /mnt/abboot
          sudo mount -o ro "${LOOP}p1" /mnt/abboot
          # 3) fetch the payload packer from the batman feed's source repo at the exact pinned commit
          PIN=$(sed -n 's|.*Batman\.git\^\([0-9a-f]\{7,40\}\).*|\1|p' feeds.conf.default | head -1)
          curl -fsSL "https://raw.githubusercontent.com/winson3QQ/Batman/${PIN}/scripts/build-ab-payload.sh" -o build-ab-payload.sh
          chmod +x build-ab-payload.sh
          # 4) assemble into the upload dir — "Upload build artifacts" (path: artifacts/<board>/*) ships it
          mkdir -p "artifacts/${{ inputs.board }}"
          ./build-ab-payload.sh root.squashfs /mnt/abboot "${{ inputs.board }}" "artifacts/${{ inputs.board }}/ab-payload-${{ inputs.board }}.tar.gz"
          sudo umount /mnt/abboot || true
          sudo losetup -d "$LOOP" || true
          ls -lah "artifacts/${{ inputs.board }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.board }}
          path: artifacts/${{ inputs.board }}/*
          if-no-files-found: error
          retention-days: 5

      - name: Upload target packages
        if: inputs.releasepackages
        uses: actions/upload-artifact@v7
        with:
          name: packages-targets-${{ inputs.target }}--${{ inputs.subtarget }}
          path: bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/packages/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload arch packages
        if: inputs.releasepackages && inputs.cpu_arch != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages-arch-${{ inputs.cpu_arch }}
          path: bin/packages/${{ inputs.cpu_arch }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ inputs.board }}
          path: build.log
          retention-days: 30
