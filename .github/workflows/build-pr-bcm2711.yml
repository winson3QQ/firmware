name: Build Firmware (PR) on bcm2711

permissions:
  contents: read

on:
  pull_request:
    paths:
    - 'boards/ekh-bcm2711/**'
    - 'boards/common/**'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/bcm27xx/**'
    - 'feeds.conf.default'
    - 'patches/ekh-bcm2711/**'
    - 'scripts/openmanet_setup.sh'
    - 'scripts/check-board-patches.sh'
    - 'scripts/board-patch-digest.sh'
    - 'scripts/patch-witness.sh'
    - 'scripts/stamp-batman-build.sh'

jobs:
  build-ekh-bcm2711:
    name: Build ekh-bcm2711
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ekh-bcm2711
      target: bcm27xx
      subtarget: bcm2711
      description: "Raspberry Pi 4, CM4"
