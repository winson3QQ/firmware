<!-- Batman #254: D-Bus policy for org.bluez. Replaces BlueZ's src/bluetooth.conf, whose
     <policy context="default"> allows EVERY local uid to drive the adapter (power it off,
     register advertisements / GATT apps, remove devices). Here only root (bluetoothd itself,
     and the provisioning helper) may talk to org.bluez, and batman-provd (uid provd) exactly the
     eight methods it uses (Batman docs/design/254-p2-impl.md §4.7). Everything else: denied by
     system.conf's defaults. bluetoothd's calls back into provd's objects are allowed by the root
     policy's send_interface lines below (no destination on purpose: keep them that way). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy user="root">
    <allow own="org.bluez"/>
    <allow send_destination="org.bluez"/>
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.GattCharacteristic1"/>
    <allow send_interface="org.bluez.GattDescriptor1"/>
    <allow send_interface="org.bluez.LEAdvertisement1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <!-- batman-provd: no own (no well-known name), no send_destination=org.freedesktop.DBus (the
       default policy allows it and keeps its denies), no receive_sender (allowed by default) -->
  <policy user="provd">
    <allow send_destination="org.bluez" send_interface="org.bluez.LEAdvertisingManager1" send_member="RegisterAdvertisement"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.LEAdvertisingManager1" send_member="UnregisterAdvertisement"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.GattManager1" send_member="RegisterApplication"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.GattManager1" send_member="UnregisterApplication"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1" send_member="Disconnect"/>
  </policy>

  <!-- no <policy context="default"> on purpose: unprivileged uids cannot reach org.bluez -->

</busconfig>
