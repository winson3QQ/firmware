# Batman #254 — bluetoothd policy for a headless mesh node (BlueZ 5.72; only keys src/main.c accepts).
# LE only, never pairable/bondable (no agent is registered — that is the real guard, see
# adapter.c adapter_set_io_capability), never discoverable by BR/EDR scans, resolvable private address.
[General]
Name = Batman
ControllerMode = le
AlwaysPairable = false
PairableTimeout = 0
DiscoverableTimeout = 0
JustWorksRepairing = never
Privacy = device
# #254 B1: LE Secure Connections only. With Privacy=device the kernel hands out the IRK and the
# identity (public) address in any pairing, bonding or not; legacy Just Works without an agent
# needs no confirmation. SC Just Works always asks user space, and there is no agent -> refused.
SecureConnections = only
NameResolving = false

[GATT]
Cache = no

[Policy]
AutoEnable = true
